<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ANIZONE - Premium Anime Streaming</title>
  
  <!-- Modern Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Core Libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Space Grotesk"', 'sans-serif']
          },
          colors: {
            brand: {
              red: '#FF2E4D',
              glow: '#ff2e4d40',
              card: '#121217',
              border: '#23232a'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #09090b;
      color: #f4f4f5;
      -webkit-tap-highlight-color: transparent;
    }
    .glass-nav {
      background: rgba(14, 14, 18, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .glow-effect {
      box-shadow: 0 0 35px -5px rgba(255, 46, 77, 0.25);
    }
    .custom-scroll::-webkit-scrollbar {
      height: 4px;
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased selection:bg-brand-red selection:text-white">

  <!-- Top Navigation Bar -->
  <nav class="sticky top-0 z-50 glass-nav border-b border-brand-border px-4 py-3 sm:px-8">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="#" class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-brand-red to-orange-500 flex items-center justify-center font-display font-bold text-white shadow-lg shadow-brand-glow">
            A
          </div>
          <span class="font-display font-extrabold text-xl tracking-tight text-white">ANI<span class="text-brand-red">ZONE</span></span>
        </a>
      </div>

      <div class="flex items-center gap-3">
        <div id="live-badge" class="flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          Cloudflare R2 Direct
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content Layout -->
  <main class="max-w-7xl mx-auto w-full p-3 sm:p-6 lg:p-8 flex-1 grid grid-cols-1 lg:grid-cols-3 gap-6">
    
    <!-- Left Column: Theater Player & Details -->
    <section class="lg:col-span-2 flex flex-col gap-4">
      
      <!-- Video Player Wrapper -->
      <div class="relative w-full aspect-video rounded-2xl overflow-hidden bg-black border border-brand-border glow-effect shadow-2xl">
        <div id="artplayer" class="w-full h-full"></div>
      </div>

      <!-- Quick Playback Navigation -->
      <div class="flex items-center justify-between bg-brand-card border border-brand-border px-4 py-2.5 rounded-xl">
        <button id="prev-btn" onclick="prevEpisode()" class="flex items-center gap-2 text-xs font-bold px-3 py-1.5 rounded-lg bg-neutral-800 text-neutral-300 hover:bg-neutral-700 disabled:opacity-40 transition-all">
          <i class="fa-solid fa-backward-step"></i> Prev
        </button>
        <span id="player-status-tag" class="text-xs font-bold text-brand-red tracking-wider uppercase">Loading Stream...</span>
        <button id="next-btn" onclick="nextEpisode()" class="flex items-center gap-2 text-xs font-bold px-3 py-1.5 rounded-lg bg-neutral-800 text-neutral-300 hover:bg-neutral-700 disabled:opacity-40 transition-all">
          Next <i class="fa-solid fa-forward-step"></i>
        </button>
      </div>

      <!-- Anime & Episode Metadata Info -->
      <div class="bg-brand-card border border-brand-border p-5 rounded-2xl flex flex-col gap-2">
        <div class="flex items-center gap-2">
          <span class="px-2.5 py-0.5 rounded-md text-[10px] font-extrabold uppercase tracking-wide bg-brand-red/10 text-brand-red border border-brand-red/20">Full HD</span>
          <span class="px-2.5 py-0.5 rounded-md text-[10px] font-bold uppercase tracking-wide bg-neutral-800 text-neutral-400 border border-neutral-700">Multi-Audio</span>
          <span class="px-2.5 py-0.5 rounded-md text-[10px] font-bold uppercase tracking-wide bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Zero Buffer</span>
        </div>
        <h1 id="anime-title" class="text-xl sm:text-2xl font-extrabold text-white tracking-tight mt-1">Black Torch</h1>
        <p id="anime-desc" class="text-xs sm:text-sm text-neutral-400 leading-relaxed">
          High-performance multi-audio anime streaming powered by Cloudflare R2 and Supabase. Multi-audio switcher available in gear settings.
        </p>
      </div>

    </section>

    <!-- Right Column: Episode Grid Sidebar -->
    <aside class="flex flex-col gap-4">
      <div class="bg-brand-card border border-brand-border rounded-2xl p-4 flex flex-col h-full max-h-[600px]">
        <div class="flex items-center justify-between pb-3 border-b border-brand-border">
          <h2 class="text-sm font-bold uppercase tracking-wider text-neutral-300 flex items-center gap-2">
            <i class="fa-solid fa-layer-group text-brand-red"></i> Available Episodes
          </h2>
          <span id="total-ep-badge" class="text-xs font-semibold px-2 py-0.5 rounded-md bg-neutral-800 text-neutral-400 border border-neutral-700">0</span>
        </div>

        <!-- Episodes Selector Buttons Grid -->
        <div id="episodes-container" class="grid grid-cols-4 sm:grid-cols-5 lg:grid-cols-4 gap-2.5 pt-4 overflow-y-auto custom-scroll pr-1">
          <!-- Dynamically Loaded From Supabase -->
        </div>
      </div>
    </aside>

  </main>

  <script>
    // Supabase Credentials
    const SUPABASE_URL = "https://legrjcwgtkqjllcbvwii.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxlZ3JqY3dndGtxamxsY2J2d2lpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0NzQ1OTgsImV4cCI6MjEwOTA1MDU5OH0.t_8pSyB6pGFqO3_uiPHcvVlqOnZkR3Upab8OAxFJ5LI";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Default Fallback
    const fallbackEpisodes = [
      {
        episode_number: 1,
        title: "Episode 1",
        stream_url: "https://pub-2189cc4e79784398ab1c74f62439b99b.r2.dev/black-torch/ep-1/master.m3u8"
      }
    ];

    let currentEpisodesList = [];
    let currentIndex = 0;
    let art = null;
    let currentHls = null;

    // Helper: Gear Icon లో ఆడియో ట్రాక్స్ మెనూ అప్‌డేట్
    function updateAudioSettingsMenu(hlsInstance, artInstance) {
      if (!hlsInstance || !hlsInstance.audioTracks || hlsInstance.audioTracks.length === 0) return;

      const tracks = hlsInstance.audioTracks;
      const audioOptions = tracks.map((tr, idx) => {
        let label = tr.name || tr.lang || `Track ${idx + 1}`;
        if (label.toLowerCase() === 'und') label = `Audio ${idx + 1}`;
        return {
          default: idx === hlsInstance.audioTrack,
          html: label,
          value: idx
        };
      });

      if (artInstance.setting.find('audio-switcher')) {
        artInstance.setting.update({
          name: 'audio-switcher',
          tooltip: audioOptions.find(o => o.value === hlsInstance.audioTrack)?.html || 'Default',
          selector: audioOptions
        });
      } else {
        artInstance.setting.add({
          name: 'audio-switcher',
          width: 220,
          html: '<i class="fa-solid fa-headphones mr-2"></i> Audio Track',
          tooltip: audioOptions.find(o => o.value === hlsInstance.audioTrack)?.html || 'Default',
          selector: audioOptions,
          onSelect: function (item) {
            hlsInstance.audioTrack = item.value;
            return item.html;
          }
        });
      }
    }

    // Video Player Initialize
    function startPlayer(url, title, epNum) {
      document.getElementById('player-status-tag').innerText = `PLAYING EPISODE ${epNum}`;
      document.getElementById('anime-title').innerText = `Black Torch - ${title}`;

      if (art) {
        if (currentHls) {
          currentHls.destroy();
          currentHls = null;
        }
        art.destroy(false);
        art = null;
      }

      art = new Artplayer({
        container: '#artplayer',
        url: url,
        type: 'm3u8',
        theme: '#FF2E4D',
        volume: 0.85,
        autoplay: false,
        pip: true,
        screenshot: true,
        setting: true,
        playbackRate: true,
        aspectRatio: true,
        fullscreen: true,
        fullscreenWeb: true,
        playsInline: true,
        autoOrientation: true,
        airplay: true,
        customType: {
          m3u8: function (video, streamUrl, artInstance) {
            if (Hls.isSupported()) {
              const hls = new Hls({
                enableWorker: true,
                lowLatencyMode: false,
                maxBufferLength: 60,
                maxMaxBufferLength: 120,
                maxBufferSize: 60 * 1000 * 1000,
                bufferBehind: 30,
                startFragPrefetch: true
              });

              hls.loadSource(streamUrl);
              hls.attachMedia(video);
              currentHls = hls;

              hls.on(Hls.Events.MANIFEST_PARSED, function () {
                updateAudioSettingsMenu(hls, artInstance);
              });

              hls.on(Hls.Events.AUDIO_TRACKS_UPDATED, function () {
                updateAudioSettingsMenu(hls, artInstance);
              });

              hls.on(Hls.Events.AUDIO_TRACK_SWITCHED, function () {
                const active = hls.audioTracks[hls.audioTrack];
                const trackName = active?.name || active?.lang || `Track ${hls.audioTrack + 1}`;
                if (artInstance.setting.find('audio-switcher')) {
                  artInstance.setting.update({
                    name: 'audio-switcher',
                    tooltip: trackName
                  });
                }
              });

              artInstance.on('destroy', () => {
                hls.destroy();
                currentHls = null;
              });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
              video.src = streamUrl;
            }
          }
        }
      });

      updateActiveButton(epNum);
    }

    // Render Buttons Grid Dynamically
    function renderButtons(episodes) {
      const container = document.getElementById('episodes-container');
      container.innerHTML = '';
      document.getElementById('total-ep-badge').innerText = episodes.length;

      episodes.forEach((ep, idx) => {
        const btn = document.createElement('button');
        btn.id = `ep-btn-${ep.episode_number}`;
        btn.className = `p-3 rounded-xl border font-bold text-xs transition-all duration-200 flex flex-col items-center justify-center gap-1 ${
          idx === currentIndex 
            ? 'bg-brand-red text-white border-brand-red shadow-lg shadow-brand-glow scale-[1.02]' 
            : 'bg-neutral-900 border-brand-border text-neutral-300 hover:border-neutral-600 hover:bg-neutral-800'
        }`;
        btn.innerHTML = `<span>EP</span><span class="text-sm font-extrabold">${ep.episode_number}</span>`;
        btn.onclick = () => {
          currentIndex = idx;
          startPlayer(ep.stream_url, ep.title, ep.episode_number);
        };
        container.appendChild(btn);
      });

      updatePrevNextState();
    }

    function updateActiveButton(epNum) {
      currentEpisodesList.forEach(ep => {
        const b = document.getElementById(`ep-btn-${ep.episode_number}`);
        if (!b) return;
        if (ep.episode_number === epNum) {
          b.className = 'p-3 rounded-xl border font-bold text-xs transition-all duration-200 flex flex-col items-center justify-center gap-1 bg-brand-red text-white border-brand-red shadow-lg shadow-brand-glow scale-[1.02]';
        } else {
          b.className = 'p-3 rounded-xl border font-bold text-xs transition-all duration-200 flex flex-col items-center justify-center gap-1 bg-neutral-900 border-brand-border text-neutral-300 hover:border-neutral-600 hover:bg-neutral-800';
        }
      });
      updatePrevNextState();
    }

    function updatePrevNextState() {
      document.getElementById('prev-btn').disabled = currentIndex === 0;
      document.getElementById('next-btn').disabled = currentIndex === currentEpisodesList.length - 1;
    }

    function prevEpisode() {
      if (currentIndex > 0) {
        currentIndex--;
        const ep = currentEpisodesList[currentIndex];
        startPlayer(ep.stream_url, ep.title, ep.episode_number);
      }
    }

    function nextEpisode() {
      if (currentIndex < currentEpisodesList.length - 1) {
        currentIndex++;
        const ep = currentEpisodesList[currentIndex];
        startPlayer(ep.stream_url, ep.title, ep.episode_number);
      }
    }

    // Fetch Database & Subscribe to Live Realtime Updates
    async function loadDatabase() {
      try {
        const { data, error } = await supabaseClient
          .from('episodes')
          .select('*')
          .order('episode_number', { ascending: true });

        if (!error && data && data.length > 0) {
          currentEpisodesList = data;
        } else {
          console.warn("Supabase empty or error, using fallback:", error);
          currentEpisodesList = [...fallbackEpisodes];
        }
      } catch (err) {
        console.warn("Supabase fetch failed:", err);
        currentEpisodesList = [...fallbackEpisodes];
      } finally {
        renderButtons(currentEpisodesList);
        const initial = currentEpisodesList[currentIndex] || currentEpisodesList[0];
        startPlayer(initial.stream_url, initial.title, initial.episode_number);
      }

      // Supabase Realtime Listener: మీరు DB లో కొత్త రో చేర్చగానే ఆటోమేటిక్ అప్‌డేట్ అవుతుంది
      supabaseClient
        .channel('public:episodes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'episodes' }, async () => {
          console.log("Database changed, reloading episodes automatically...");
          const { data } = await supabaseClient
            .from('episodes')
            .select('*')
            .order('episode_number', { ascending: true });
          if (data && data.length > 0) {
            currentEpisodesList = data;
            renderButtons(currentEpisodesList);
            updateActiveButton(currentEpisodesList[currentIndex]?.episode_number);
          }
        })
        .subscribe();
    }

    window.addEventListener('DOMContentLoaded', loadDatabase);
  </script>
</body>
</html>
